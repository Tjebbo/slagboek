<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a6a86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Slagboek">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Slagboek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
/* Layout: één smalle app-kolom (telefoon eerst), sticky kop met tabs, statusblok bovenaan Vandaag. */
:root {
  --bg: #eef3f5; --surface: #ffffff; --soft: #e2ebef; --ink: #0f1d26; --muted: #56676f; --faint: #8a9aa2; --line: #d3dde2;
  --accent: #0a6a86; --accent-ink: #ffffff; --band: rgba(10,106,134,.13);
  --groen: #1d8049; --geel: #a86a12; --rood: #bb342d; --grijs: #6f8089;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0c151a; --surface: #13212a; --soft: #1a2c36; --ink: #e5eef2; --muted: #93a6b0; --faint: #627580; --line: #24363f;
  --accent: #46b6d3; --accent-ink: #052029; --band: rgba(70,182,211,.16);
  --groen: #4fc283; --geel: #e2a744; --rood: #f06c62; --grijs: #8d9ea7; color-scheme: dark } }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); padding-bottom: env(safe-area-inset-bottom, 0px) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
[hidden] { display: none !important }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 14px 8px }
.brand h1 { font: 700 26px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; margin: 0 }
.brand .datum { font: 500 12px var(--f-data); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; text-align: right }
nav.tabs { display: flex; gap: 4px; padding-bottom: 10px }
nav.tabs button { flex: 1; font: 600 14px var(--f-body); padding: 8px 4px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); border-color: var(--line) }
main { padding-block: 18px 56px; display: grid; gap: 22px }
.stack { display: grid; gap: 14px }
h2 { font: 700 15px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0 }
.muted { color: var(--muted) } .small { font-size: 13px }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums }
button, input, select { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600 }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.link { border: 0; background: none; padding: 4px 0; color: var(--accent) }
.btn:disabled { opacity: .5; cursor: default }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.melding { padding: 10px 12px; border-radius: 8px; font-size: 14px }
.melding.fout { background: color-mix(in srgb, var(--rood) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--rood) 40%, var(--line)) }
.melding.ok { background: color-mix(in srgb, var(--groen) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--groen) 40%, var(--line)) }
.melding.info { background: var(--soft) }
.veld { display: grid; gap: 4px; min-width: 0 }
.veld label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--muted) }
.veld input, .veld select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg) }

/* Ontgrendelen */
.slot { max-width: 420px; margin: 12vh auto 0; display: grid; gap: 14px }
.slot h1 { font: 700 44px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; margin: 0 }

/* Status */
.status { --c: var(--grijs); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)) }
.status.groen { --c: var(--groen) } .status.geel { --c: var(--geel) } .status.rood { --c: var(--rood) }
.status .boven { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px }
.status .label { font: 700 30px/1.02 var(--f-display); text-transform: uppercase; letter-spacing: .03em; color: var(--c); text-wrap: balance }
.status .score { font: 700 54px/.9 var(--f-display); font-variant-numeric: tabular-nums; color: var(--c); text-align: right }
.status .score small { display: block; font: 500 11px var(--f-data); color: var(--muted); letter-spacing: .04em; margin-top: 4px }
.status p { margin: 0 }
.factoren { display: grid; gap: 0; margin-top: 2px }
.factor { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 7px 0; border-top: 1px solid color-mix(in srgb, var(--c) 22%, var(--line)); font-size: 14px }
.factor .w { font: 500 12.5px var(--f-data); color: var(--muted); grid-column: 1 }
.factor .i { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 600 11px var(--f-data); text-transform: uppercase; letter-spacing: .05em; padding: 3px 7px; border-radius: 5px }
.i.goed { color: var(--groen); background: color-mix(in srgb, var(--groen) 14%, var(--surface)) }
.i.let { color: var(--geel); background: color-mix(in srgb, var(--geel) 14%, var(--surface)) }
.i.slecht { color: var(--rood); background: color-mix(in srgb, var(--rood) 14%, var(--surface)) }

/* Sessies */
.sessie { display: grid; gap: 6px }
.sessie + .sessie { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px }
.sessie .kop { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center }
.sessie .naam { font-weight: 600; overflow-wrap: anywhere }
.sessie .tekst { white-space: pre-wrap; color: var(--muted); font-size: 14px; overflow-wrap: anywhere }
.chip { font: 600 11px var(--f-data); text-transform: uppercase; letter-spacing: .06em; padding: 3px 7px; border-radius: 5px; background: var(--soft) }
.chip.zone { background: var(--accent); color: var(--accent-ink) }
.chip.gedaan { background: color-mix(in srgb, var(--groen) 16%, var(--surface)); color: var(--groen) }
.chip.vb { background: transparent; border: 1px dashed var(--muted); color: var(--muted) }
.tip { font-size: 14px; padding: 9px 11px; border-radius: 8px; background: var(--soft) }
.tip b { font-family: var(--f-data); font-weight: 500 }
.feit { font: 500 12.5px var(--f-data); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px }

/* Check-in */
form.checkin { display: grid; gap: 14px }
.schaal { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px }
label.pick { position: relative; display: grid; place-items: center; padding: 8px 0; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font: 500 13px var(--f-data); background: var(--bg) }
label.pick input { position: absolute; opacity: 0; pointer-events: none }
label.pick:has(input:checked) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
label.pick:focus-within { outline: 2px solid var(--accent); outline-offset: 2px }
.schaal-uitleg { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted) }

/* Zones */
.zones { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px }
.zone { display: grid; gap: 2px; padding: 8px; border-radius: 8px; background: var(--soft); min-width: 0 }
.zone b { font: 700 16px var(--f-display); letter-spacing: .05em }
.zone span { font: 500 12px var(--f-data); font-variant-numeric: tabular-nums }
.zone small { font-size: 11px; color: var(--muted); overflow-wrap: anywhere }

/* Week */
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 10px }
.weeknav strong { font: 700 20px var(--f-display); letter-spacing: .04em; text-transform: uppercase }
.dag { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; padding-block: 12px; border-top: 1px solid var(--line) }
.dag:first-child { border-top: 0 }
.dag .wd { font: 700 18px/1.1 var(--f-display); text-transform: uppercase }
.dag .wd small { display: block; font: 500 11.5px var(--f-data); color: var(--muted) }
.dag .wd .sc { display: inline-block; margin-top: 4px; font: 600 11px var(--f-data); padding: 1px 5px; border-radius: 4px }
.dag.vandaag .wd { color: var(--accent) }
.dag .leeg { color: var(--muted); font-size: 14px }
.dag .sessie + .sessie { padding-top: 8px; margin-top: 8px }

/* Trends */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font: 600 13px var(--f-body); cursor: pointer; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
.grafiek { position: relative }
.grafiek .titel { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap }
.grafiek .titel b { font-weight: 600 }
.grafiek .nu { font: 500 13px var(--f-data); color: var(--muted) }
.grafiek svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y }
.grafiek svg text { font: 500 10.5px var(--f-data); fill: var(--muted) }
.legenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted) }
.legenda i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px }
.tooltip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font: 500 12px/1.4 var(--f-data); padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); z-index: 2 }
.tabel { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 13.5px }
th, td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top }
th { border-top: 0; font: 600 11px var(--f-data); text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
td.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap }
td select { padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg) }

/* Schema */
.drop { display: grid; gap: 8px; place-items: center; text-align: center; padding: 26px 16px; border: 1.5px dashed var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer }
.drop.over { border-color: var(--accent); background: var(--soft) }
.drop strong { font: 700 20px var(--f-display); letter-spacing: .04em; text-transform: uppercase }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px }
@media (max-width: 460px) { .zone { padding: 7px 5px } .zone span { font-size: 11px } .status .label { font-size: 25px } .status .score { font-size: 46px } }
@media (prefers-reduced-motion: no-preference) { .btn, label.pick, nav.tabs button { transition: background .15s, border-color .15s } }
</style>
</head>
<body>

<div id="slot" class="wrap" hidden>
  <form class="slot" id="ontgrendel">
    <h1>Slagboek</h1>
    <p class="muted" style="margin:0">Je data is versleuteld. Vul je sleutel in (SLAGBOEK_SLEUTEL).</p>
    <div class="veld"><label for="sleutel">Sleutel</label><input id="sleutel" type="password" autocomplete="current-password" required></div>
    <label class="check"><input type="checkbox" id="onthoud" checked> Onthouden op dit apparaat</label>
    <div id="slotfout" class="melding fout" hidden></div>
    <button class="btn primary" type="submit">Openen</button>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <div class="brand"><h1>Slagboek</h1><span class="datum" id="kopdatum"></span></div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="vandaag" aria-selected="true">Vandaag</button>
        <button role="tab" data-tab="week" aria-selected="false">Week</button>
        <button role="tab" data-tab="trends" aria-selected="false">Trends</button>
        <button role="tab" data-tab="schema" aria-selected="false">Schema</button>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div id="globaal" class="melding info" hidden></div>
    <section id="tab-vandaag" class="stack"></section>
    <section id="tab-week" class="stack" hidden></section>
    <section id="tab-trends" class="stack" hidden></section>
    <section id="tab-schema" class="stack" hidden></section>
  </main>
</div>

<script>
"use strict";
// ---------- datums ----------
const p2 = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const vanIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const vandaag = () => iso(new Date());
const plus = (s, n) => { const d = vanIso(s); d.setDate(d.getDate() + n); return iso(d); };
const wd = s => (vanIso(s).getDay() + 6) % 7;
const maandagVan = s => plus(s, -wd(s));
const dagenTussen = (a, b) => Math.round((vanIso(b) - vanIso(a)) / 864e5);
const geldig = (y, m, d) => { const dt = new Date(y, m - 1, d); return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d ? iso(dt) : null; };
const isoWeek = s => { const d = vanIso(s); d.setDate(d.getDate() + 3 - wd(s)); const j = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - j) / 864e5 - 3 + ((j.getDay() + 6) % 7)) / 7); };
const DAG_KORT = ["ma", "di", "wo", "do", "vr", "za", "zo"];
const MAAND_KORT = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const mooi = s => `${DAG_KORT[wd(s)]} ${vanIso(s).getDate()} ${MAAND_KORT[vanIso(s).getMonth()]}`;
const kort = s => `${vanIso(s).getDate()} ${MAAND_KORT[vanIso(s).getMonth()]}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uurMin = u => u == null ? "–" : `${Math.floor(u)}u${p2(Math.round((u % 1) * 60))}`;
const minTekst = m => m >= 60 ? `${Math.floor(m / 60)}u${p2(m % 60)}` : `${m}′`;

// ---------- schema-lezer (Excel/CSV van de coach) ----------
const DAGEN = { ma: 0, maa: 0, maandag: 0, mon: 0, monday: 0, di: 1, din: 1, dinsdag: 1, tue: 1, tuesday: 1,
  wo: 2, woe: 2, woensdag: 2, wed: 2, wednesday: 2, do: 3, don: 3, donderdag: 3, thu: 3, thursday: 3,
  vr: 4, vrij: 4, vrijdag: 4, fri: 4, friday: 4, za: 5, zat: 5, zaterdag: 5, sat: 5, saturday: 5,
  zo: 6, zon: 6, zondag: 6, sun: 6, sunday: 6 };
const MAANDEN = { jan: 1, feb: 2, mrt: 3, maa: 3, mar: 3, apr: 4, mei: 5, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, okt: 10, oct: 10, nov: 11, dec: 12 };
const LEEG = new Set(["", "-", "--", "nan", "none", "nvt", "x", "rust", "rustdag", "vrij", "off", "rest"]);
const SPORT_REGELS = [
  ["VirtualRow", /ergo|\bc2\b|concept ?2|roeimachine|\brp3\b|\bindoor/],
  ["WeightTraining", /kracht|\bgym\b|squat|deadlift|bench|\bcore\b|clean|\bpress\b|circuit|stabi/],
  ["Ride", /fiets|\bbike\b|wattbike|\bride\b|wielren|spinning|\bmtb\b|zwift/],
  ["Run", /hardlo|\blopen\b|\brun\b|\bjog/],
  ["Rowing", /roei|\bboot\b|skiff|\bwater\b|dubbel|\bacht\b|\bvier\b|\btwee\b|\brow/],
];
const SPORT_NL = { Rowing: "Roeien", VirtualRow: "Ergo", Ride: "Fietsen", WeightTraining: "Kracht", Run: "Hardlopen", Other: "Overig" };
const MOMENTEN = [["ochtend", /ochtend|morning|\bam\b|\bvroeg\b/], ["middag", /middag|afternoon|\blunch\b/], ["avond", /avond|evening|\bpm\b/]];
const MOMENT_ORDE = { ochtend: 0, middag: 1, avond: 2 };

function kiesJaar(dag, maand) {
  const nu = vandaag(), j = vanIso(nu).getFullYear();
  const opties = [j - 1, j, j + 1].map(y => geldig(y, maand, dag)).filter(Boolean);
  return opties.sort((a, b) => Math.abs(dagenTussen(nu, a)) - Math.abs(dagenTussen(nu, b)))[0] || null;
}
function alsDatum(cel) {
  if (cel == null) return null;
  if (typeof cel === "number") {
    if (cel > 40000 && cel < 60000) { const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(cel) * 864e5); return geldig(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
    return null;
  }
  const s = String(cel).trim().toLowerCase();
  let m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return geldig(+m[1], +m[2], +m[3]);
  m = s.match(/\b(\d{1,2})[-/.](\d{1,2})(?:[-/.](\d{2,4}))?\b/);
  if (m) {
    if (m[3]) return geldig(+m[3] + (m[3].length === 2 ? 2000 : 0), +m[2], +m[1]);
    return +m[2] >= 1 && +m[2] <= 12 ? kiesJaar(+m[1], +m[2]) : null;
  }
  m = s.match(/\b(\d{1,2})\s*([a-z]{3})[a-z]*\.?(?:\s+(\d{4}))?/);
  if (m && MAANDEN[m[2]]) return m[3] ? geldig(+m[3], MAANDEN[m[2]], +m[1]) : kiesJaar(+m[1], MAANDEN[m[2]]);
  return null;
}
function weekdag(cel) {
  if (typeof cel !== "string") return null;
  const w = cel.toLowerCase().match(/[a-z]+/g);
  return w && w[0] in DAGEN ? DAGEN[w[0]] : null;
}
function weekMaandag(cel) {
  if (typeof cel !== "string") return null;
  const m = cel.toLowerCase().match(/\bweek\s*(\d{1,2})\b/);
  if (!m) return null;
  const nu = vandaag(), j = vanIso(nu).getFullYear(), w = +m[1];
  const opties = [j - 1, j, j + 1].map(y => { const jan4 = iso(new Date(y, 0, 4)); const ma = plus(maandagVan(jan4), (w - 1) * 7); return isoWeek(ma) === w ? ma : null; }).filter(Boolean);
  return opties.sort((a, b) => Math.abs(dagenTussen(nu, a)) - Math.abs(dagenTussen(nu, b)))[0] || null;
}
function tekst(cel) {
  if (cel == null) return "";
  const s = String(cel).trim();
  return LEEG.has(s.toLowerCase().replace(/^[ .]+|[ .]+$/g, "")) ? "" : s;
}
function herkenSport(t) { t = t.toLowerCase(); for (const [s, r] of SPORT_REGELS) if (r.test(t)) return s; return "Rowing"; }
function herkenMoment(t) { t = (t || "").toLowerCase(); for (const [m, r] of MOMENTEN) if (r.test(t)) return m; return null; }
function schatMinuten(tx, sport) {
  let t = tx.toLowerCase().replace(/[’´]/g, "'").replace(/\b[rp]\s*\d+'(?:\d+"?)?/g, " ");
  let tot = 0;
  const uMin = /\b(\d)\s*[uh:]\s*(\d{2})\b/g;
  for (const m of t.matchAll(uMin)) tot += +m[1] * 60 + +m[2];
  t = t.replace(uMin, " ");
  const xMin = /(\d+)\s*[x×]\s*(\d+(?:[.,]\d+)?)\s*(?:'|min\b|minuten)/g;
  for (const m of t.matchAll(xMin)) tot += +m[1] * parseFloat(m[2].replace(",", "."));
  t = t.replace(xMin, " ");
  for (const m of t.matchAll(/(\d+(?:[.,]\d+)?)\s*(?:'|min\b|minuten)/g)) tot += parseFloat(m[1].replace(",", "."));
  for (const m of t.matchAll(/(\d+(?:[.,]\d+)?)\s*(?:uur|hr|hours?)\b/g)) tot += parseFloat(m[1].replace(",", ".")) * 60;
  if (!tot) {
    let meters = 0;
    for (const m of t.matchAll(/(?:(\d+)\s*[x×]\s*)?(\d+(?:[.,]\d+)?)\s*(km|k|m)\b/g)) {

const roosterKoppen = rijen => rijen.map((r, i) => [i, r.filter(c => weekdag(c) != null).length]).filter(x => x[1] >= 3).map(x => x[0]);

    SK = ["sport", "type", "soort"], MK = ["moment", "tijd", "dagdeel", "time"];

    r.filter(c => typeof c === "string" && c.trim()).length >= 2);

  if (kopI >= 0) {
    const kop = rijen[kopI];
    datumJ = kop.findIndex(c => past(c, DK));
    if (datumJ < 0) datumJ = kop.findIndex(c => String(c ?? "").trim().toLowerCase() === "dag");
    sportJ = kop.findIndex((c, j) => past(c, SK) && j !== datumJ); if (sportJ < 0) sportJ = null;
    momentJ = kop.findIndex((c, j) => past(c, MK) && j !== datumJ); if (momentJ < 0) momentJ = null;
    trainingJs = kop.map((c, j) => j).filter(j => past(kop[j], TK) && ![datumJ, sportJ, momentJ].includes(j));
    if (!trainingJs.length) trainingJs = kop.map((c, j) => j).filter(j => ![datumJ, sportJ, momentJ].includes(j));
    data = rijen.slice(kopI + 1);
  } else {
    const breedte = Math.max(0, ...rijen.map(r => r.length));
    const tel = Array.from({ length: breedte }, (_, j) => rijen.filter(r => alsDatum(r[j])).length);
    if (!tel.length || Math.max(...tel) < 2) return [];
    datumJ = tel.indexOf(Math.max(...tel));
    trainingJs = tel.map((_, j) => j).filter(j => j !== datumJ);
    data = rijen;
  }
  const uit = []; let laatste = null;
  for (const r of data) {
    const cel = j => (j != null && j < r.length ? r[j] : null);

    const tx = trainingJs.map(j => tekst(cel(j))).filter(t => t && (weekdag(t) == null || t.length > 10)).join("\n");

// ---------- versleuteling (gelijk aan slagboek/crypto.py) ----------
const tekstBytes = s => new TextEncoder().encode(s);
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function sleutelVan(wachtzin, salt) {
  const basis = await crypto.subtle.importKey("raw", tekstBytes(wachtzin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, basis, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function ontsleutel(tekst, wachtzin) {
  const d = JSON.parse(tekst);
  const sleutel = await sleutelVan(wachtzin, unb64(d.salt));
  const platte = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(d.iv) }, sleutel, unb64(d.ct));
  return JSON.parse(new TextDecoder().decode(platte));
}
async function versleutel(obj, wachtzin) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const sleutel = await sleutelVan(wachtzin, salt);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, sleutel, tekstBytes(JSON.stringify(obj)));
  return JSON.stringify({ v: 1, salt: b64(salt), iv: b64(iv), ct: b64(ct) });
}

const opslag = {

  zet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },

function repo() {
  const eigen = opslag.lees("slagboek-repo");
  if (eigen) return eigen;
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const pad = location.pathname.split("/").filter(Boolean)[0];

async function gh(methode, pad, body) {

  const r = await fetch(`https://api.github.com/repos/${repo()}/contents/${pad}`, {
    method: methode, cache: "no-store",

    body: body ? JSON.stringify(body) : undefined,

}

  if (e.message === "token-geweigerd") return "GitHub weigert de token. Is hij verlopen, of mist hij 'Contents: read and write' voor deze repository?";
  if (e.name === "OperationError") return "Ontsleutelen lukte niet: je sleutel klopt niet met die van GitHub Actions.";

      <p>${esc(a.uitleg)}</p>
      <div class="factoren">${a.factoren.map(f => { const [k, t] = IMPACT(f); return `<div class="factor"><span>${esc(f.naam)}${f.uitleg ? ` <span class="muted small">· ${esc(f.uitleg)}</span>` : ""}</span><span class="i ${k}">${t}</span><span class="w">${esc(f.waarde)}</span></div>`; }).join("")}</div>
    </div>` : `<div class="status"><div class="label">Nog geen data van vannacht</div><p>Open de Garmin Connect-app zodat je horloge synct; intervals.icu krijgt het dan vanzelf. Slagboek haalt elk uur nieuwe data op.</p></div>`;
  const schaal = (naam, waarde, links, rechts, titel) => `<div class="veld"><span class="lbl" id="l-${naam}">${titel}</span>
    <div class="schaal" role="radiogroup" aria-labelledby="l-${naam}">${[1, 2, 3, 4, 5].map(n => `<label class="pick"><input type="radio" name="${naam}" id="${naam}-${n}" value="${n}"${waarde === n ? " checked" : ""}>${n}</label>`).join("")}</div>
    <div class="schaal-uitleg"><span>${links}</span><span>${rechts}</span></div></div>`;
  const checkin = `<div class="stack"><h2>Hoe voel je je?</h2><form class="checkin card" id="checkin">
      ${schaal("gevoel", ci?.gevoel, "slecht", "top", "Gevoel")}${schaal("spierpijn", ci?.spierpijn, "geen", "veel", "Spierpijn")}
      <div class="row"><button class="btn primary" type="submit"${S.bezig ? " disabled" : ""}>${ci ? "Bijwerken" : "Opslaan"}</button>
      <span class="small muted">Slaap, HRV en rusthartslag komen van je Garmin. Dit voegt toe wat je horloge niet meet.</span></div>
    </form></div>`;
  const z = D.zones || {};
  const zones = Object.keys(z).length ? `<div class="stack"><h2>Jouw hartslagzones</h2><div class="card stack">
      <div class="zones">${Object.entries(z).map(([k, [lo, hi]]) => `<div class="zone"><b>${k}</b><span>${lo}–${hi}</span><small>${esc({ UT2: "rustige duur", UT1: "stevige duur", AT: "drempel", TR: "wedstrijd", AN: "sprint" }[k])}</small></div>`).join("")}</div>
      <span class="small muted">Op basis van max ${D.maxHr} bpm (${esc(D.maxHrBron)}).</span></div></div>` : "";
  return `${verouderd ? `<div class="melding info">Deze data is van ${esc(mooi(dag))}. De volgende update komt binnen een uur.</div>` : ""}
    ${status}
    <div class="stack"><h2>Vandaag · ${esc(mooi(dag))}</h2><div class="card">
      ${sessies.length || extra.length ? sessies.map(([, t]) => sessieHtml(t)).join("") + extra.map(extraHtml).join("")
        : Object.keys(D.trainingen).length ? `<span class="muted">Geen training gepland. Herstel goed.</span>`
        : `<div class="stack"><span>Nog geen schema. Zet het Excel-bestand van je coach erin.</span><div><button class="btn primary" data-tab="schema">Schema toevoegen</button></div></div>`}
    </div></div>
    ${checkin}
    <div class="stack"><h2>Morgen · ${esc(mooi(plus(dag, 1)))}</h2><div class="card">
      ${morgen.length ? morgen.map(([, t]) => sessieHtml(t, { tip: false })).join("") : `<span class="muted">Rustdag.</span>`}
      ${morgen.some(([, t]) => t.moment === "ochtend") ? `<div class="tip" style="margin-top:12px">Morgen een ochtendtraining: op tijd naar bed, dan telt je slaap mee in je score.</div>` : ""}
    </div></div>
    ${zones}
    <p class="small muted" style="margin:0">Laatste Garmin-meting: ${D.laatsteMeting ? esc(mooi(D.laatsteMeting)) : "–"} · bijgewerkt ${esc(D.gegenereerd.slice(11, 16))}${D.gegenereerd.slice(0, 10) !== vandaag() ? " op " + esc(mooi(D.gegenereerd.slice(0, 10))) : ""}. Het schema van je coach blijft leidend; Slagboek zegt hoe je het invult.</p>`;
}

function renderWeek() {
  const ma = S.weekStart, dag = vandaag(), D = S.data;
  const scores = Object.fromEntries(D.dagen.map(r => [r.d, r.score]));
  let gepland = 0, gedaan = 0;
  const kleur = s => s == null ? "" : s >= 75 ? "groen" : s >= 55 ? "geel" : "rood";
  const rijen = Array.from({ length: 7 }, (_, i) => {
    const d = plus(ma, i), s = trainingenOp(d), e = extraOp(d), sc = scores[d];
    s.forEach(([, t]) => { gepland += t.minuten || 0; if (t.gedaan) gedaan += t.gedaan.min || 0; });
    e.forEach(a => gedaan += a.min || 0);
    return `<div class="dag${d === dag ? " vandaag" : ""}"><div class="wd">${DAG_KORT[i]}<small>${vanIso(d).getDate()} ${MAAND_KORT[vanIso(d).getMonth()]}</small>
        ${sc != null ? `<span class="sc i ${kleur(sc) === "groen" ? "goed" : kleur(sc) === "geel" ? "let" : "slecht"}" title="dagscore">${sc}</span>` : ""}</div>
      <div>${s.length || e.length ? s.map(([, t]) => sessieHtml(t, { tip: d === D.vandaag })).join("") + e.map(extraHtml).join("") : `<span class="leeg">–</span>`}</div></div>`;
  }).join("");
  return `<div class="weeknav"><button class="btn" data-actie="week" data-d="-7" aria-label="Vorige week">‹</button>
      <div style="text-align:center"><strong>Week ${isoWeek(ma)}</strong><div class="small muted mono">${esc(mooi(ma))} – ${esc(mooi(plus(ma, 6)))}</div></div>
      <button class="btn" data-actie="week" data-d="7" aria-label="Volgende week">›</button></div>
    ${ma !== maandagVan(dag) ? `<div style="text-align:center"><button class="btn link" data-actie="week" data-d="0">Naar deze week</button></div>` : ""}
    <div class="card">${rijen}</div>
    <div class="small muted" style="text-align:center">Gepland <span class="mono">${minTekst(gepland)}</span> · gedaan volgens Garmin <span class="mono">${minTekst(gedaan)}</span></div>`;
}

function renderTrends() {
  const D = S.data, reeks = D.dagen.slice(-S.bereik), dagen = reeks.map(r => r.d), kol = k => reeks.map(r => r[k] ?? null);
  const laatste = k => { const r = [...reeks].reverse().find(r => r[k] != null); return r ? r[k] : null; };
  const gem = k => { const w = kol(k).filter(v => v != null); return w.length ? w.reduce((a, b) => a + b, 0) / w.length : null; };
  const kies = `<div class="row" style="justify-content:space-between"><h2>Trends</h2><div class="seg" role="group" aria-label="Periode">
    ${[30, 90].map(n => `<button data-actie="bereik" data-n="${n}" aria-pressed="${S.bereik === n}">${n} dagen</button>`).join("")}</div></div>`;
  const ratio = laatste("ratio");
  const weken = D.weken.slice(S.bereik === 30 ? -5 : -12);
  const sporten = [...new Set(weken.flatMap(w => Object.keys(w.min)))];
  return kies + [
    grafiek({ id: "g-score", titel: "Dagscore", nu: laatste("score") != null ? `vandaag ${laatste("score")}` : "", dagen,
      reeksen: [{ naam: "Dagscore", waarden: kol("score"), kleur: "var(--accent)" }], uitleg: "75+ klaar om te knallen · 55–74 doen wat er staat · onder 55 rustig aan" }),
    grafiek({ id: "g-hrv", titel: "HRV (nacht)", nu: laatste("hrv") != null ? `${laatste("hrv")} ms` : "", dagen, fmt: v => Math.round(v),
      reeksen: [{ naam: "HRV", waarden: kol("hrv"), kleur: "var(--accent)", tip: v => `${Math.round(v)} ms` }],
      band: { naam: "je normale bereik (28 dagen)", lo: kol("hrvLaag"), hi: kol("hrvHoog") } }),
    grafiek({ id: "g-slaap", titel: "Slaap", nu: gem("slaapU") != null ? `gem ${uurMin(gem("slaapU"))}` : "", dagen, fmt: v => v + "u",
      reeksen: [{ naam: "Slaap", waarden: kol("slaapU"), kleur: "var(--accent)", type: "staaf", tip: uurMin }] }),
    grafiek({ id: "g-rhr", titel: "Rusthartslag", nu: laatste("rhr") != null ? `${laatste("rhr")} bpm` : "", dagen,
      reeksen: [{ naam: "Rusthartslag", waarden: kol("rhr"), kleur: "var(--accent)", tip: v => `${Math.round(v)} bpm` }] }),
    grafiek({ id: "g-load", titel: "Belasting", nu: ratio != null ? `×${ratio.toFixed(2)} t.o.v. gewend` : "", dagen, vanaf0: true,
      uitleg: "Trainingsload van de laatste 7 dagen, naast wat je gemiddeld per week deed in de 4 weken ervoor. Tussen ×0,8 en ×1,3 bouw je netjes op.",
      reeksen: [{ naam: "Afgelopen 7 dagen", waarden: kol("acuut"), kleur: "var(--accent)" }, { naam: "Gewend (4 weken)", waarden: kol("chronisch"), kleur: "var(--muted)", stippel: true }] }),
    kol("bb").some(v => v != null) ? grafiek({ id: "g-bb", titel: "Body Battery bij opstaan", nu: laatste("bb") != null ? String(laatste("bb")) : "", dagen,
      reeksen: [{ naam: "Body Battery", waarden: kol("bb"), kleur: "var(--accent)" }] }) : "",
    `<div class="card stack"><b>Trainingsuren per week</b><div class="tabel"><table><thead><tr><th>Week</th>${sporten.map(s => `<th>${esc(SPORT_NL_ALLES[s] || s)}</th>`).join("")}<th>Totaal</th></tr></thead><tbody>
      ${weken.slice().reverse().map(w => { const tot = Object.values(w.min).reduce((a, b) => a + b, 0); return `<tr><td class="num">wk ${w.week}</td>${sporten.map(s => `<td class="num">${w.min[s] ? minTekst(w.min[s]) : "–"}</td>`).join("")}<td class="num"><b>${tot ? minTekst(tot) : "–"}</b></td></tr>`; }).join("")}
    </tbody></table></div></div>`,
  ].join("");
}

function renderSchema() {
  const pv = S.preview, D = S.data, nu = vandaag();
  const komend = Object.values(D.trainingen).filter(t => t.datum >= nu).length;
  const voorbeelden = Object.values(D.trainingen).filter(t => t.voorbeeld).length;
  const heeftToken = !!opslag.lees("slagboek-gh");
  const melding = S.melding ? `<div class="melding ${S.melding.soort}">${esc(S.melding.tekst)}</div>` : "";
  const tabel = pv ? `<div class="stack"><h2>${pv.lijst.length} trainingen gevonden${pv.voorbeeld ? " · voorbeeld" : ""}</h2>
      <p class="small muted" style="margin:0">Check of het klopt. De sport kun je per regel aanpassen.</p>
      <div class="card tabel" style="padding:0"><table><thead><tr><th>Dag</th><th>Sport</th><th>Training</th><th>Min</th></tr></thead><tbody>
      ${pv.lijst.map((t, i) => `<tr><td class="num">${esc(mooi(t.datum))}${t.moment ? `<div class="muted small">${esc(t.moment)}</div>` : ""}</td>
        <td><select data-pv="${i}" aria-label="Sport">${Object.entries(SPORT_NL_ALLES).map(([k, v]) => `<option value="${k}"${k === t.sport ? " selected" : ""}>${v}</option>`).join("")}</select></td>
        <td>${esc(t.tekst)}</td><td class="num">${t.minuten ? "~" + t.minuten : "–"}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="row"><button class="btn primary" data-actie="opslaan"${S.bezig ? " disabled" : ""}>${S.bezig ? "Bezig met opslaan…" : "Opslaan"}</button><button class="btn" data-actie="annuleer">Annuleren</button></div></div>` : "";
  return `${heeftToken ? "" : `<div class="melding info">Om je schema op te slaan heeft Slagboek eenmalig een GitHub-token nodig. Zie Instellingen onderaan.</div>`}
    <label class="drop" id="drop" for="bestand">
      <strong>Schema van je coach</strong>
      <span class="muted">Sleep het Excel- of CSV-bestand hierheen, of tik om te kiezen.</span>
      <span class="btn">Bestand kiezen</span>
      <input type="file" id="bestand" accept=".xlsx,.xlsm,.xls,.csv" hidden>
    </label>
    <div class="row">
      <div class="veld" style="max-width:270px"><label for="startdatum">Maandag van week 1 (alleen als het rooster geen datums heeft)</label><input type="date" id="startdatum" value="${esc(S.start || "")}"></div>
      <label class="check"><input type="checkbox" id="verleden"${S.verleden ? " checked" : ""}> Ook trainingen van vóór vandaag</label>
    </div>
    ${melding}${tabel}
    <div class="card stack small">
      <div>Na opslaan rekent Slagboek alles opnieuw door met je Garmin-data. Dat duurt 1 à 2 minuten.</div>
      <div>Een nieuwe versie van hetzelfde schema werkt bestaande trainingen bij. Sessies die je coach heeft geschrapt, verdwijnen.</div>
      <div class="row muted"><span>${komend} trainingen gepland vanaf vandaag.</span>
        ${!pv ? `<button class="btn link" data-actie="voorbeeld">Probeer met een voorbeeldschema</button>` : ""}
        ${voorbeelden ? `<button class="btn link" data-actie="wis-voorbeelden"${S.bezig ? " disabled" : ""}>Voorbeeldtrainingen wissen (${voorbeelden})</button>` : ""}</div>
    </div>
    <div class="stack"><h2>Instellingen</h2><form class="card stack" id="instellingen">
      <div class="veld"><label for="gh-repo">GitHub-repository</label><input id="gh-repo" value="${esc(repo())}" placeholder="gebruikersnaam/slagboek"></div>
      <div class="veld"><label for="gh-token">GitHub-token${heeftToken ? " (ingesteld)" : ""}</label><input id="gh-token" type="password" autocomplete="off" placeholder="${heeftToken ? "•••••••• laat leeg om te houden" : "github_pat_…"}"></div>
      <div class="row"><button class="btn" type="submit">Bewaren op dit apparaat</button><button class="btn link" type="button" data-actie="vergrendel">Vergrendelen en sleutel vergeten</button></div>
      <span class="small muted">Fine-grained token met alleen deze repository en 'Contents: read and write'. Hij blijft op dit apparaat.</span>
    </form></div>`;
}

function render() {
  if (!S.data) return;
  const d = vandaag();
  document.getElementById("kopdatum").textContent = `${mooi(d)} · wk ${isoWeek(d)}`;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  for (const t of TABS) document.getElementById("tab-" + t).hidden = t !== S.tab;
  const g = document.getElementById("globaal");
  g.hidden = !S.wachtOp && !S.fout;
  g.className = "melding " + (S.fout ? "fout" : "info");
  g.textContent = S.fout || "Opgeslagen. Slagboek rekent alles opnieuw door; deze pagina ververst vanzelf zodra het klaar is (1–2 minuten).";
  const el = document.getElementById("tab-" + S.tab);
  el.innerHTML = { vandaag: renderVandaag, week: renderWeek, trends: renderTrends, schema: renderSchema }[S.tab]();
}

// ---------- acties ----------
function kiesTab(tab) { S.tab = tab; opslag.zet("slagboek-tab", tab); render(); window.scrollTo(0, 0); }
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-actie]");
  if (!t || !S.data) return;
  S.fout = null;
  if (t.dataset.tab) return kiesTab(t.dataset.tab);
  const a = t.dataset.actie;
  if (a === "week") { S.weekStart = +t.dataset.d === 0 ? maandagVan(vandaag()) : plus(S.weekStart, +t.dataset.d); render(); }
  else if (a === "bereik") { S.bereik = +t.dataset.n; render(); }
  else if (a === "voorbeeld") laadVoorbeeld();
  else if (a === "annuleer") { S.preview = null; S.melding = null; render(); }
  else if (a === "opslaan") opslaan();
  else if (a === "wis-voorbeelden") {
    S.bezig = true; render();
    try {
      await wijzigInvoer("schema.enc", { trainingen: {} }, d => { for (const [k, v] of Object.entries(d.trainingen)) if (v.voorbeeld) delete d.trainingen[k]; }, "Voorbeeldtrainingen gewist");
      S.melding = { soort: "ok", tekst: "Voorbeeldtrainingen gewist." }; wachtOpNieuweData();
    } catch (err) { S.melding = { soort: "fout", tekst: foutTekst(err) }; }
    S.bezig = false; render();
  } else if (a === "vergrendel") { opslag.zet("slagboek-sleutel", null); location.reload(); }
});
document.addEventListener("submit", async e => {
  if (e.target.id === "checkin") {
    e.preventDefault();
    const f = new FormData(e.target), gevoel = +f.get("gevoel") || null, spierpijn = +f.get("spierpijn") || null;
    if (!gevoel && !spierpijn) return;
    const dag = vandaag();
    S.bezig = true; render();
    try {
      await wijzigInvoer("checkins.enc", { checkins: {} }, d => { d.checkins[dag] = { ...(gevoel && { gevoel }), ...(spierpijn && { spierpijn }) }; }, `Check-in ${dag}`);
      S.data.checkins = { ...(S.data.checkins || {}), [dag]: { gevoel, spierpijn } };
      wachtOpNieuweData();
      S.bezig = false; render();
    } catch (err) { S.bezig = false; S.fout = foutTekst(err); render(); }
  } else if (e.target.id === "instellingen") {
    e.preventDefault();
    const r = document.getElementById("gh-repo").value.trim(), tk = document.getElementById("gh-token").value.trim();
    opslag.zet("slagboek-repo", r || null);
    if (tk) opslag.zet("slagboek-gh", tk);
    S.melding = { soort: "ok", tekst: "Instellingen bewaard op dit apparaat." }; render();
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "bestand" && el.files[0]) leesBestand(el.files[0]);
  else if (el.id === "startdatum") { S.start = el.value || null; if (S.laatsteBestand) verwerk(S.laatsteBestand); }
  else if (el.id === "verleden") { S.verleden = el.checked; if (S.laatsteBestand) verwerk(S.laatsteBestand); }
  else if (el.dataset.pv != null && S.preview) S.preview.lijst[+el.dataset.pv].sport = el.value;
});
["dragover", "dragleave", "drop"].forEach(type => document.addEventListener(type, e => {
  const zone = e.target.closest && e.target.closest("#drop");
  if (!zone) return;
  e.preventDefault();
  zone.classList.toggle("over", type === "dragover");
  if (type === "drop" && e.dataTransfer.files[0]) leesBestand(e.dataTransfer.files[0]);
}));

async function leesBestand(file) {
  if (!window.XLSX) { S.melding = { soort: "fout", tekst: "De Excel-lezer is nog niet geladen. Probeer het over een paar seconden opnieuw." }; return render(); }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    S.laatsteBestand = { naam: file.name, bladen: wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: true })) };
    verwerk(S.laatsteBestand);
  } catch (err) { S.preview = null; S.melding = { soort: "fout", tekst: `"${file.name}" kon ik niet openen. Is het een Excel- (.xlsx) of CSV-bestand?` }; render(); }
}
function verwerk(bestand, voorbeeld = false) {
  try {
    let lijst = leesRijen(bestand.bladen, S.start);
    const totaal = lijst.length;
    if (!S.verleden && !voorbeeld) lijst = lijst.filter(t => t.datum >= vandaag());
    if (!lijst.length) { S.preview = null; S.melding = { soort: "fout", tekst: totaal ? `Alle ${totaal} trainingen in dit bestand liggen in het verleden. Vink "Ook trainingen van vóór vandaag" aan om ze toch op te slaan.` : "Ik vind geen trainingen in dit bestand. Stuur het naar Claude, dan wordt de lezer aangepast op het schema van je coach." }; }
    else { S.preview = { lijst, voorbeeld }; S.melding = null; }
  } catch (err) { S.preview = null; S.melding = { soort: "fout", tekst: err.message }; }
  render();
}
function laadVoorbeeld() {
  const rijen = [
    [null, "Ma", "Di", "Wo", "Do", "Vr", "Za", "Zo"],
    ["Ochtend", "Ergo 3x20' UT1 r20/22, 3' rust", "Rust", "Boot 2x6km UT2 r18", "Kracht: squat 5x5, deadlift 4x6", "Skiff 60' UT2", "Wedstrijdtempo 6x500m TR r32+", "Fietsen 1u30 Z2"],
    ["Middag", null, "Fiets 60' Z2", null, null, "Core + stabi 30 min", null, null],
  ];
  const oud = S.start; S.start = maandagVan(vandaag());
  verwerk({ naam: "voorbeeld", bladen: [rijen] }, true);
  S.start = oud;
}
async function opslaan() {
  const pv = S.preview; if (!pv) return;
  S.bezig = true; render();
  try {
    const nieuw = new Set(pv.lijst.map(t => t.id)), van = pv.lijst[0].datum, tot = pv.lijst[pv.lijst.length - 1].datum;
    let gewist = 0;
    await wijzigInvoer("schema.enc", { trainingen: {} }, d => {
      for (const [k, t] of Object.entries(d.trainingen)) if (t.datum >= van && t.datum <= tot && !nieuw.has(k) && !t.voorbeeld === !pv.voorbeeld) { delete d.trainingen[k]; gewist++; }
      for (const t of pv.lijst) {
        const doc = { datum: t.datum, nr: t.nr, naam: t.naam, tekst: t.tekst, sport: t.sport, moment: t.moment, minuten: t.minuten };
        if (pv.voorbeeld) doc.voorbeeld = true;
        for (const k in doc) if (doc[k] == null) delete doc[k];
        d.trainingen[t.id] = doc;
      }
    }, pv.voorbeeld ? "Voorbeeldschema" : `Schema ${van} t/m ${tot}`);
    S.melding = { soort: "ok", tekst: `${pv.lijst.length} trainingen opgeslagen${gewist ? `, ${gewist} geschrapte sessie(s) verwijderd` : ""}.` };
    S.preview = null; S.weekStart = maandagVan(van < vandaag() ? vandaag() : van);
    wachtOpNieuweData();
  } catch (err) { S.melding = { soort: "fout", tekst: foutTekst(err) }; }
  S.bezig = false; render();
}

// ---------- start ----------
(async () => {
  const bewaard = opslag.lees("slagboek-sleutel");
  if (bewaard) {
    try { await open(bewaard, true); return; } catch (e) { if (e.name === "OperationError") opslag.zet("slagboek-sleutel", null); }
  }
  document.getElementById("slot").hidden = false;
  document.getElementById("sleutel").focus();
})();
document.addEventListener("visibilitychange", async () => {
  if (document.hidden || !S.data) return;
  try { const d = await laadData(); if (d.gegenereerd !== S.data.gegenereerd) S.data = d; } catch (e) {}
  render();
});
let herteken;
window.addEventListener("resize", () => { clearTimeout(herteken); herteken = setTimeout(() => { if (S.tab === "trends") render(); }, 200); });

</script>
</body>
</html>

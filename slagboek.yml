name: slagboek

on:
  schedule:
    - cron: "7 4-21 * * *"   # elk uur, ±05:00–23:00 NL-tijd
  push:
    paths: ["invoer/**"]      # nieuw schema of check-in vanuit de site -> meteen bijwerken
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slagboek
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SLAGBOEK_SLEUTEL: ${{ secrets.SLAGBOEK_SLEUTEL }}
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAX_HR: ${{ vars.MAX_HR }}
      SCHEMA_NAAR_KALENDER: ${{ vars.SCHEMA_NAAR_KALENDER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Onthoudt alleen of het ochtendbericht vandaag al is verstuurd.
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: staat-${{ github.run_id }}
          restore-keys: staat-

      - run: mkdir -p .cache && python bouw.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: staat-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
